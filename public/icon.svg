<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Circle backdrop -->
  <circle cx="256" cy="256" r="210" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- 3 Blocks representing 1:1:1 Zone Ratio -->
  <!-- Protein Block (Red) -->
  <g transform="translate(100, 150)">
    <rect width="90" height="150" rx="16" fill="url(#pGrad)" />
    <text x="45" y="85" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
    <text x="45" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fecaca" text-anchor="middle">7g</text>
  </g>
  
  <!-- Carb Block (Blue/Cyan) -->
  <g transform="translate(211, 150)">
    <rect width="90" height="150" rx="16" fill="url(#cGrad)" />
    <text x="45" y="85" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    <text x="45" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#cffafe" text-anchor="middle">9g</text>
  </g>
  
  <!-- Fat Block (Gold/Amber) -->
  <g transform="translate(322, 150)">
    <rect width="90" height="150" rx="16" fill="url(#fGrad)" />
    <text x="45" y="85" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
    <text x="45" y="125" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fef3c7" text-anchor="middle">1.5g</text>
  </g>
  
  <!-- 1:1:1 Zone Badge -->
  <rect x="140" y="340" width="232" height="46" rx="23" fill="#dc2626" />
  <text x="256" y="371" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">1 : 1 : 1 ZONE</text>
</svg>
